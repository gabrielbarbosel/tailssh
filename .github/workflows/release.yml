name: release

# Cut a release by pushing a tag (e.g. `git tag v0.3.0 && git push --tags`):
# builds every target binary + SHA256SUMS and publishes them, which is exactly what
# each node's auto-update pulls from releases/latest.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: build binaries
        run: |
          set -eu
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${t%/*}"; arch="${t#*/}"
            out="dist/tailssh-${os}-${arch}"
            [ "$os" = windows ] && out="${out}.exe"
            echo "building $out"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$out" .
          done
          ( cd dist && sha256sum tailssh-* > SHA256SUMS )

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
